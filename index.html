<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daria Birthday Cinema</title>

<style>
body{
margin:0;
padding:0;
font-family:Arial, sans-serif;
background:linear-gradient(180deg,#1a0000,#3d0000,#120000);
color:white;
text-align:center;
min-height:100vh;
}

.wrap{
padding:30px 20px;
max-width:520px;
margin:auto;
}

h1{
color:#ffd700;
font-size:42px;
margin-bottom:10px;
text-shadow:0 0 15px rgba(255,215,0,.35);
}

.sub{
opacity:.8;
margin-bottom:28px;
}

.box{
background:rgba(255,255,255,.06);
padding:28px;
border-radius:22px;
box-shadow:0 0 25px rgba(0,0,0,.4);
}

input{
width:92%;
padding:15px;
font-size:18px;
border:none;
border-radius:12px;
text-align:center;
margin-bottom:18px;
}

button{
padding:16px 30px;
font-size:22px;
border:none;
border-radius:14px;
background:linear-gradient(90deg,#d4af37,#ffd700);
font-weight:bold;
cursor:pointer;
}

button:hover{transform:scale(1.03);}

#rolling{
margin-top:25px;
font-size:26px;
min-height:45px;
}

#result{
margin-top:22px;
font-size:34px;
font-weight:bold;
line-height:1.3;
}

#poster{
display:none;
margin-top:18px;
max-width:270px;
width:92%;
border-radius:18px;
box-shadow:0 0 24px rgba(0,0,0,.5);
}

.msg{
margin-top:18px;
font-size:20px;
color:#ffd0d0;
}

.small{
margin-top:18px;
font-size:12px;
opacity:.6;
cursor:pointer;
}

#admin{
display:none;
margin-top:15px;
}

.adminBtn{
margin:6px;
padding:10px 14px;
font-size:14px;
}
</style>
</head>
<body>

<div class="wrap">

<h1>🎬 Daria Birthday Cinema</h1>
<div class="sub">Luxury Movie Night</div>

<div class="box">

<input id="name" placeholder="Введите своё имя">

<button onclick="play()">🎲 Испытать судьбу</button>

<div id="rolling"></div>
<div id="result"></div>
<img id="poster">

<div class="msg" id="msg"></div>

<div class="small" onclick="admin()">admin</div>

<div id="admin">
<button class="adminBtn" onclick="resetAll()">Сбросить всё</button>
<button class="adminBtn" onclick="testSpin()">Тест</button>
</div>

</div>
</div>

<script>

const sheetURL="https://script.google.com/macros/s/AKfycbwnde_-a6LXALfDc5AmIgUoUb_NentvbgbHMpQ0lNNFa9jynGd9qggA8mUi58bPLmaS3Q/exec";

let films = [
{name:"Гарри Поттер",img:"https://picsum.photos/300/450?1"},
{name:"Очень странные дела",img:"https://picsum.photos/300/450?2"},
{name:"Шрек",img:"https://picsum.photos/300/450?3"},
{name:"Чарли и шоколадная фабрика",img:"https://picsum.photos/300/450?4"},
{name:"Один дома",img:"https://picsum.photos/300/450?5"},
{name:"Титаник",img:"https://picsum.photos/300/450?6"},
{name:"Король лев",img:"https://picsum.photos/300/450?7"},
{name:"Ледниковый период",img:"https://picsum.photos/300/450?8"},
{name:"Черный лебедь",img:"https://picsum.photos/300/450?9"},
{name:"Голодные игры",img:"https://picsum.photos/300/450?10"},
{name:"Как избежать наказание за убийство",img:"https://picsum.photos/300/450?11"},
{name:"Пираты Карибского моря",img:"https://picsum.photos/300/450?12"},
{name:"Очень страшное кино",img:"https://picsum.photos/300/450?13"},
{name:"Хроники Нарнии",img:"https://picsum.photos/300/450?14"},
{name:"Бурлеск",img:"https://picsum.photos/300/450?15"},
{name:"5 элемент",img:"https://picsum.photos/300/450?16"},
{name:"50 оттенков серого",img:"https://picsum.photos/300/450?17"},
{name:"Американская история ужасов",img:"https://picsum.photos/300/450?18"},
{name:"Алиса в стране чудес",img:"https://picsum.photos/300/450?19"},
{name:"Сумерки",img:"https://picsum.photos/300/450?20"},
{name:"Холодное сердце",img:"https://picsum.photos/300/450?21"}
];

function norm(v){ return v.trim().toLowerCase(); }

function play(){

clearUI();

let name=document.getElementById("name").value.trim();

if(!name){
msg("Введите имя");
return;
}

let players=JSON.parse(localStorage.getItem("players"))||{};
let used=JSON.parse(localStorage.getItem("used"))||[];

let key=norm(name);

if(players[key]){
msg("⚠️ По этому имени фильм уже выбран.");
return;
}

let available=films.filter(f=>!used.includes(f.name));

if(available.length===0){
msg("Все фильмы разобраны 🎬");
return;
}

spin(()=>{
let chosen=available[Math.floor(Math.random()*available.length)];

players[key]=chosen.name;
used.push(chosen.name);

localStorage.setItem("players",JSON.stringify(players));
localStorage.setItem("used",JSON.stringify(used));

show(chosen);

saveToSheet(name,chosen.name);
});

}

function spin(done){

let roll=document.getElementById("rolling");
let c=0;

let t=setInterval(()=>{
roll.innerHTML=films[Math.floor(Math.random()*films.length)].name;
c++;
if(c>18){
clearInterval(t);
roll.innerHTML="";
done();
}
},140);

}

function show(f){
document.getElementById("result").innerHTML="🎉<br>"+f.name;
let p=document.getElementById("poster");
p.src=f.img;
p.style.display="inline-block";
}

function msg(t){
document.getElementById("msg").innerHTML=t;
}

function clearUI(){
document.getElementById("msg").innerHTML="";
document.getElementById("result").innerHTML="";
document.getElementById("rolling").innerHTML="";
document.getElementById("poster").style.display="none";
}

function saveToSheet(name,film){
fetch(sheetURL,{
method:"POST",
body:JSON.stringify({
name:name,
film:film
})
});
}

function admin(){
let pass=prompt("Пароль:");
if(pass==="Daria2026"){
document.getElementById("admin").style.display="block";
}
}

function resetAll(){
if(confirm("Сбросить всё?")){
localStorage.removeItem("players");
localStorage.removeItem("used");
alert("Готово");
}
}

function testSpin(){
clearUI();
spin(()=>{
msg("Тест завершён");
});
}

</script>
</body>
</html>
