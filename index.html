<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Party</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:linear-gradient(to bottom,#111,#300);
color:white;
text-align:center;
padding-top:80px;
overflow:hidden;
}

h1{
font-size:42px;
margin-bottom:10px;
}

p{
opacity:0.8;
}

button{
margin-top:30px;
padding:18px 40px;
font-size:24px;
border:none;
border-radius:15px;
background:gold;
cursor:pointer;
font-weight:bold;
box-shadow:0 0 20px gold;
}

button:hover{
transform:scale(1.05);
}

#result{
margin-top:50px;
font-size:40px;
font-weight:bold;
min-height:120px;
animation:fade 1s ease;
}

@keyframes fade{
from{opacity:0; transform:scale(0.7);}
to{opacity:1; transform:scale(1);}
}

.confetti{
position:fixed;
width:10px;
height:10px;
top:-10px;
animation:fall 3s linear forwards;
}

@keyframes fall{
to{
transform:translateY(110vh) rotate(720deg);
opacity:0;
}
}
</style>
</head>

<body>

<h1>🎬 Movie Party</h1>
<p>Нажми и узнай свой фильм</p>

<button onclick="pickFilm()">🎲 Получить фильм</button>

<div id="result"></div>

<script>
let films = [
"Матрица",
"Шрек",
"Барби",
"Гарри Поттер",
"Аватар",
"Титаник",
"Джокер",
"Пираты Карибского моря",
"Звёздные войны"
];

function pickFilm(){

let used = JSON.parse(localStorage.getItem("usedFilms")) || [];
let available = films.filter(f => !used.includes(f));

if(available.length===0){
document.getElementById("result").innerHTML="😎 Все фильмы разобраны";
return;
}

let result = document.getElementById("result");

let count = 0;

let roll = setInterval(()=>{
result.innerHTML = films[Math.floor(Math.random()*films.length)];
count++;
if(count>15){
clearInterval(roll);

let film = available[Math.floor(Math.random()*available.length)];
used.push(film);
localStorage.setItem("usedFilms", JSON.stringify(used));

result.innerHTML = "🎉<br>"+film;
confetti();
}
},150);

}

function confetti(){
for(let i=0;i<40;i++){
let c = document.createElement("div");
c.className="confetti";
c.style.left=Math.random()*100+"vw";
c.style.background="hsl("+Math.random()*360+",100%,50%)";
c.style.animationDuration=(2+Math.random()*2)+"s";
document.body.appendChild(c);

setTimeout(()=>c.remove(),4000);
}
}
</script>

</body>
</html>
