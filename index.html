<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Daria Birthday Cinema</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:radial-gradient(circle at top,#5e0000,#220000,#100000);
color:white;
text-align:center;
min-height:100vh;
padding:20px;
overflow-x:hidden;
}

h1{
color:#ffd700;
font-size:42px;
margin-bottom:8px;
text-shadow:0 0 15px rgba(255,215,0,.45);
}

.sub{
opacity:.85;
margin-bottom:14px;
}

#wheelWrap{
position:relative;
width:340px;
height:340px;
margin:18px auto;
transition:.8s;
}

#wheel{
width:100%;
height:100%;
border-radius:50%;
border:8px solid #d4af37;
box-shadow:0 0 28px rgba(255,215,0,.25);
transition:transform 5s cubic-bezier(.15,.8,.2,1);
background:
conic-gradient(
#7a0000 0deg 17deg,#b30000 17deg 34deg,#6d0000 34deg 51deg,
#8f0000 51deg 68deg,#5c0000 68deg 85deg,#9a0000 85deg 102deg,
#700000 102deg 119deg,#b80000 119deg 136deg,#6a0000 136deg 153deg,
#960000 153deg 170deg,#7a0000 170deg 187deg,#b30000 187deg 204deg,
#6d0000 204deg 221deg,#8f0000 221deg 238deg,#5c0000 238deg 255deg,
#9a0000 255deg 272deg,#700000 272deg 289deg,#b80000 289deg 306deg,
#6a0000 306deg 323deg,#960000 323deg 340deg,#7a0000 340deg 360deg);
}

#pointer{
position:absolute;
top:-12px;
left:50%;
transform:translateX(-50%);
font-size:34px;
color:#ffd700;
}

.panel{
max-width:430px;
margin:auto;
background:rgba(255,255,255,.06);
padding:22px;
border-radius:18px;
box-shadow:0 0 25px rgba(0,0,0,.35);
}

input{
width:92%;
padding:14px;
font-size:18px;
border:none;
border-radius:12px;
text-align:center;
margin-bottom:14px;
}

button{
padding:15px 28px;
font-size:22px;
border:none;
border-radius:14px;
cursor:pointer;
font-weight:bold;
background:linear-gradient(90deg,#d4af37,#ffd700);
}

#resultBox{
display:none;
margin-top:20px;
animation:fade .8s ease;
}

#poster{
max-width:280px;
width:92%;
border-radius:18px;
box-shadow:0 0 30px rgba(0,0,0,.6);
}

#filmName{
font-size:34px;
font-weight:bold;
margin-top:16px;
line-height:1.2;
}

.msg{
margin-top:16px;
font-size:20px;
color:#ffd1d1;
}

.small{
margin-top:16px;
font-size:12px;
opacity:.6;
cursor:pointer;
}

#admin{
display:none;
margin-top:12px;
}

.adminBtn{
margin:5px;
padding:8px 14px;
font-size:14px;
}

.mute{
margin-top:10px;
font-size:14px;
cursor:pointer;
opacity:.8;
}

@keyframes fade{
from{opacity:0;transform:scale(.85);}
to{opacity:1;transform:scale(1);}
}
</style>
</head>
<body>

<h1>🎬 Daria Birthday Cinema</h1>
<div class="sub">Luxury Full Final Edition</div>

<div id="wheelWrap">
<div id="pointer">▼</div>
<div id="wheel"></div>
</div>

<div class="panel">

<input id="name" placeholder="Введите своё имя">

<button onclick="play()">🎲 Испытать судьбу</button>

<div class="mute" onclick="toggleMute()">🔊 звук</div>

<div id="resultBox">
<img id="poster">
<div id="filmName"></div>
</div>

<div class="msg" id="msg"></div>

<div class="small" onclick="admin()">admin</div>

<div id="admin">
<button class="adminBtn" onclick="resetAll()">Сбросить всё</button>
<button class="adminBtn" onclick="testSpin()">Тест</button>
</div>

</div>

<audio id="music" loop src="audio/music.mp3"></audio>
<audio id="spinSound" src="audio/spin.mp3"></audio>
<audio id="winSound" src="audio/win.mp3"></audio>

<script>
const sheetURL="https://script.google.com/macros/s/AKfycbwnde_-a6LXALfDc5AmIgUoUb_NentvbgbHMpQ0lNNFa9jynGd9qggA8mUi58bPLmaS3Q/exec";

let muted=false;
let wheel=document.getElementById("wheel");
let wheelWrap=document.getElementById("wheelWrap");
let angle=0;

let films=[
{name:"Гарри Поттер",img:"images/harry.jpg"},
{name:"Очень странные дела",img:"images/stranger.jpg"},
{name:"Шрек",img:"images/shrek.jpg"},
{name:"Чарли и шоколадная фабрика",img:"images/charlie.jpg"},
{name:"Один дома",img:"images/homealone.jpg"},
{name:"Титаник",img:"images/titanic.jpg"},
{name:"Король лев",img:"images/lionking.jpg"},
{name:"Ледниковый период",img:"images/iceage.jpg"},
{name:"Черный лебедь",img:"images/blackswan.jpg"},
{name:"Голодные игры",img:"images/hungergames.jpg"},
{name:"Как избежать наказание за убийство",img:"images/murder.jpg"},
{name:"Пираты Карибского моря",img:"images/pirates.jpg"},
{name:"Очень страшное кино",img:"images/scarymovie.jpg"},
{name:"Хроники Нарнии",img:"images/narnia.jpg"},
{name:"Бурлеск",img:"images/burlesque.jpg"},
{name:"5 элемент",img:"images/fifthelement.jpg"},
{name:"50 оттенков серого",img:"images/shades.jpg"},
{name:"Американская история ужасов",img:"images/ahs.jpg"},
{name:"Алиса в стране чудес",img:"images/alice.jpg"},
{name:"Сумерки",img:"images/twilight.jpg"},
{name:"Холодное сердце",img:"images/frozen.jpg"}
];

function norm(v){return v.trim().toLowerCase();}

function play(){

clearUI();

let name=document.getElementById("name").value.trim();
if(!name){msg("Введите имя");return;}

let players=JSON.parse(localStorage.getItem("players"))||{};
let used=JSON.parse(localStorage.getItem("used"))||[];
let key=norm(name);

if(players[key]){
msg("⚠️ По этому имени фильм уже выбран.");
return;
}

let available=films.filter(f=>!used.includes(f.name));

if(available.length===0){
msg("Все фильмы разобраны 🎬");
return;
}

let chosen=available[Math.floor(Math.random()*available.length)];

startMusic();
playSound("spinSound");

let index=films.findIndex(f=>f.name===chosen.name);
let sector=360/films.length;
let stop=360-(index*sector)-sector/2;

angle += 360*6 + stop;
wheel.style.transform="rotate("+angle+"deg)";

setTimeout(()=>{
document.getElementById("spinSound").pause();
document.getElementById("spinSound").currentTime=0;
playSound("winSound");

players[key]=chosen.name;
used.push(chosen.name);

localStorage.setItem("players",JSON.stringify(players));
localStorage.setItem("used",JSON.stringify(used));

wheelWrap.style.opacity="0";
wheelWrap.style.transform="scale(.7)";

setTimeout(()=>{
wheelWrap.style.display="none";
showResult(chosen);
},700);

saveToSheet(name,chosen.name);

},5200);

}

function showResult(f){
document.getElementById("resultBox").style.display="block";
document.getElementById("poster").src=f.img;
document.getElementById("filmName").innerHTML="🎉<br>"+f.name;
}

function saveToSheet(name,film){
fetch(sheetURL,{
method:"POST",
body:JSON.stringify({name:name,film:film})
});
}

function msg(t){
document.getElementById("msg").innerHTML=t;
}

function clearUI(){
document.getElementById("msg").innerHTML="";
document.getElementById("resultBox").style.display="none";
}

function toggleMute(){
muted=!muted;
document.getElementById("music").muted=muted;
document.getElementById("spinSound").muted=muted;
document.getElementById("winSound").muted=muted;
}

function startMusic(){
let m=document.getElementById("music");
m.play().catch(()=>{});
}

function playSound(id){
document.getElementById(id).play().catch(()=>{});
}

function admin(){
let pass=prompt("Пароль:");
if(pass==="Daria2026"){
document.getElementById("admin").style.display="block";
}
}

function resetAll(){
if(confirm("Очистить всё?")){
localStorage.removeItem("players");
localStorage.removeItem("used");
location.reload();
}
}

function testSpin(){
angle+=360*5+Math.random()*360;
wheel.style.transform="rotate("+angle+"deg)";
}
</script>
</body>
</html>
