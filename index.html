<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Daria Birthday Cinema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">


<style>
body{
margin:0;
font-family:'Playfair Display', serif;
background:
radial-gradient(circle at top, #5c0000 0%, #2a0000 35%, #140000 100%);
color:white;
text-align:center;
min-height:100vh;
padding:20px;
position:relative;
overflow-x:hidden;
}

.particles{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
z-index:0;
background-image:
radial-gradient(circle, rgba(255,215,0,.20) 1px, transparent 1px),
radial-gradient(circle, rgba(255,215,0,.12) 1px, transparent 1px);
background-size:120px 120px, 180px 180px;
background-position:0 0, 60px 60px;
animation:floatDust 18s linear infinite;
opacity:.35;
}

@keyframes floatDust{
0%{transform:translateY(0);}
100%{transform:translateY(-40px);}
}

body > *:not(.particles){
position:relative;
z-index:2;
}

h1{
font-family:'Cinzel', serif;
color:#ffd700;
font-size:46px;
letter-spacing:2px;
margin-bottom:8px;
text-shadow:
0 0 8px rgba(255,215,0,.35),
0 0 18px rgba(255,215,0,.18);
}

.sub{
opacity:.85;
margin-bottom:14px;
}

#wheelWrap{
position:relative;
width:360px;
height:360px;
margin:22px auto;
transition:.8s;
z-index:10;
filter:drop-shadow(0 20px 30px rgba(0,0,0,.35));
}

#wheel{
width:100%;
height:100%;
border-radius:50%;
position:relative;
overflow:hidden;

border:12px solid #d4af37;

box-shadow:
0 0 0 2px rgba(255,255,255,.08),
0 0 28px rgba(255,215,0,.22),
inset 0 0 22px rgba(255,255,255,.05),
inset 0 -18px 35px rgba(0,0,0,.28);

transition:transform 5s cubic-bezier(.15,.8,.2,1);

background:
repeating-conic-gradient(
from 0deg,
#5a0000 0deg 8.5714deg,
#8f0000 8.5714deg 17.1428deg
);
background-size:100% 100%;
}

#wheel::before{
content:"";
position:absolute;
inset:0;
border-radius:50%;
pointer-events:none;
z-index:3;

background:
repeating-conic-gradient(
from 0deg,
transparent 0deg 16.55deg,
rgba(255,215,0,.70) 16.55deg 17.1428deg
);
}

#pointer{
position:absolute;
top:-18px;
left:50%;
transform:translateX(-50%);
z-index:30;

width:0;
height:0;
border-left:18px solid transparent;
border-right:18px solid transparent;
border-top:34px solid #ffd700;

filter:
drop-shadow(0 0 10px rgba(255,215,0,.45))
drop-shadow(0 6px 8px rgba(0,0,0,.35));
}

.panel{
max-width:430px;
margin:auto;
background:rgba(255,255,255,.06);
padding:22px;
border-radius:18px;
box-shadow:0 0 25px rgba(0,0,0,.35);
}

input{
width:92%;
padding:14px;
font-size:18px;
border:none;
border-radius:12px;
text-align:center;
margin-bottom:14px;
}

button{
padding:16px 30px;
font-size:22px;
border:none;
border-radius:14px;
cursor:pointer;
font-weight:bold;
font-family:'Cinzel', serif;
color:#2a0000;
background:linear-gradient(180deg,#ffe58a,#d4af37,#b8860b);
box-shadow:
0 6px 18px rgba(0,0,0,.35),
0 0 14px rgba(255,215,0,.35);
transition:.25s;
}

button:hover{
transform:scale(1.04);
filter:brightness(1.06);
}

#resultBox{
display:none;
margin-top:10px;
position:relative;
z-index:50;
opacity:0;
transform:translateY(20px) scale(.94);
transition:all .8s ease;
}

#poster{
max-width:220px;
width:68vw;
max-height:52vh;
object-fit:cover;
border-radius:20px;
box-shadow:
0 20px 45px rgba(0,0,0,.55),
0 0 18px rgba(255,215,0,.12);
display:block;
margin:auto;
animation:
posterFloat 4s ease-in-out infinite,
posterGlow 3s ease-in-out infinite;
}

#filmName{
font-family:'Cinzel', serif;
font-size:30px;
font-weight:700;
margin-bottom:14px;
line-height:1.2;
color:#ffe7a0;
letter-spacing:1px;
text-shadow:
0 0 8px rgba(255,215,0,.18),
0 0 16px rgba(0,0,0,.45);

opacity:0;
transform:translateY(18px);
transition:all .7s ease;
}

#hub{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:74px;
height:74px;
border-radius:50%;

background:
radial-gradient(circle at 30% 30%,
#fff2a8 0%,
#ffd700 28%,
#d4af37 58%,
#8a6a00 100%);

box-shadow:
0 0 16px rgba(255,215,0,.45),
inset 0 4px 8px rgba(255,255,255,.35),
inset 0 -8px 12px rgba(0,0,0,.25);

z-index:20;
}

.msg{
margin-top:16px;
font-size:20px;
color:#ffd1d1;
}

.small{
margin-top:16px;
font-size:12px;
opacity:.6;
cursor:pointer;
}

#admin{
display:none;
margin-top:12px;
}

.adminBtn{
margin:5px;
padding:8px 14px;
font-size:14px;
}

.mute{
margin-top:10px;
font-size:14px;
cursor:pointer;
opacity:.8;
}

.flash{
position:fixed;
inset:0;
background:
radial-gradient(circle,
rgba(255,240,180,.95) 0%,
rgba(255,215,0,.65) 18%,
rgba(255,180,0,.18) 45%,
transparent 72%);
pointer-events:none;
opacity:0;
animation:flashReveal .9s ease-out;
z-index:999;
}

@keyframes posterFloat{
0%,100%{
transform:translateY(0) scale(1);
}
50%{
transform:translateY(-6px) scale(1.02);
}
}

@keyframes flashReveal{
0%{opacity:0;}
15%{opacity:1;}
55%{opacity:.7;}
100%{opacity:0;}
}

@keyframes posterGlow{
0%,100%{
box-shadow:
0 20px 45px rgba(0,0,0,.55),
0 0 12px rgba(255,215,0,.18),
0 0 24px rgba(255,215,0,.10);
}

50%{
box-shadow:
0 20px 45px rgba(0,0,0,.55),
0 0 28px rgba(255,215,0,.38),
0 0 52px rgba(255,215,0,.22);
}

@keyframes fade{
from{opacity:0;transform:scale(.85);}
to{opacity:1;transform:scale(1);}
}
</style>
</head>
<body>
<div class="particles"></div>

<h1>🎬 Daria Birthday Cinema</h1>
<div class="sub">Luxury Full Final Edition</div>

<div id="wheelWrap">
  <div id="pointer"></div>
  <div id="wheel">
    <div id="hub"></div>
  </div>
</div>

<div class="panel">

<input id="name" class="uiItem" placeholder="Введите своё имя">

<button onclick="play()" class="uiItem">🎲 Испытать судьбу</button>

<div class="mute uiItem" onclick="toggleMute()">🔊 звук</div>

<div id="resultBox">
<img id="poster">
<div id="filmName"></div>
</div>

<div class="msg" id="msg"></div>

<div class="small" onclick="admin()">admin</div>

<div id="admin">
<button class="adminBtn" onclick="resetAll()">Сбросить всё</button>
<button class="adminBtn" onclick="testSpin()">Тест</button>
</div>

</div>

<audio id="music" loop src="audio/music.mp3"></audio>
<audio id="spinSound" src="audio/spin.mp3"></audio>
<audio id="winSound" src="audio/win.mp3"></audio>

<script>
const sheetURL="https://script.google.com/macros/s/AKfycbwnde_-a6LXALfDc5AmIgUoUb_NentvbgbHMpQ0lNNFa9jynGd9qggA8mUi58bPLmaS3Q/exec";

let muted=false;
let wheel=document.getElementById("wheel");
let wheelWrap=document.getElementById("wheelWrap");
let angle=0;

let films=[
{name:"Гарри Поттер",img:"images/harry.jpg"},
{name:"Очень странные дела",img:"images/stranger.jpg"},
{name:"Шрек",img:"images/shrek.jpg"},
{name:"Чарли и шоколадная фабрика",img:"images/charlie.jpg"},
{name:"Один дома",img:"images/homealone.jpg"},
{name:"Титаник",img:"images/titanic.jpg"},
{name:"Король лев",img:"images/lionking.jpg"},
{name:"Ледниковый период",img:"images/iceage.jpg"},
{name:"Черный лебедь",img:"images/blackswan.jpg"},
{name:"Голодные игры",img:"images/hungergames.jpg"},
{name:"Как избежать наказание за убийство",img:"images/murder.jpg"},
{name:"Пираты Карибского моря",img:"images/pirates.jpg"},
{name:"Очень страшное кино",img:"images/scarymovie.jpg"},
{name:"Хроники Нарнии",img:"images/narnia.jpg"},
{name:"Бурлеск",img:"images/burlesque.jpg"},
{name:"5 элемент",img:"images/fifthelement.jpg"},
{name:"50 оттенков серого",img:"images/shades.jpg"},
{name:"Американская история ужасов",img:"images/ahs.jpg"},
{name:"Алиса в стране чудес",img:"images/alice.jpg"},
{name:"Сумерки",img:"images/twilight.jpg"},
{name:"Холодное сердце",img:"images/frozen.jpg"}
];

function norm(v){return v.trim().toLowerCase();}

function play(){

clearUI();

let name=document.getElementById("name").value.trim();
if(!name){msg("Введите имя");return;}

let players=JSON.parse(localStorage.getItem("players"))||{};
let used=JSON.parse(localStorage.getItem("used"))||[];
let key=norm(name);

if(players[key]){
msg("⚠️ По этому имени фильм уже выбран.");
return;
}

let available=films.filter(f=>!used.includes(f.name));

if(available.length===0){
msg("Все фильмы разобраны 🎬");
return;
}

let chosen=available[Math.floor(Math.random()*available.length)];

startMusic();
playSound("spinSound");

let index=films.findIndex(f=>f.name===chosen.name);
let sector=360/films.length;
let stop=360-(index*sector)-sector/2;

angle += 360*6 + stop;
wheel.style.transform="rotate("+angle+"deg)";

setTimeout(()=>{
document.getElementById("spinSound").pause();
document.getElementById("spinSound").currentTime=0;
playSound("winSound");

players[key]=chosen.name;
used.push(chosen.name);

localStorage.setItem("players",JSON.stringify(players));
localStorage.setItem("used",JSON.stringify(used));

wheelWrap.style.opacity="0";
wheelWrap.style.transform="scale(.7)";

setTimeout(()=>{
wheelWrap.style.display="none";
showResult(chosen);
},700);

saveToSheet(name,chosen.name);

},5200);

}

function showResult(f){

let flash=document.createElement("div");
flash.className="flash";
document.body.appendChild(flash);

setTimeout(()=>flash.remove(),900);

document.querySelectorAll(".uiItem").forEach(el=>{
el.style.display="none";
});

let box=document.getElementById("resultBox");
let poster=document.getElementById("poster");
let title=document.getElementById("filmName");

poster.src=f.img;
title.innerHTML="🎬 "+f.name;

box.style.display="block";

setTimeout(()=>{
box.style.opacity="1";
box.style.transform="translateY(0) scale(1)";
},120);

setTimeout(()=>{
title.style.opacity="1";
title.style.transform="translateY(0)";
},500);

}

function saveToSheet(name,film){
fetch(sheetURL,{
method:"POST",
body:JSON.stringify({name:name,film:film})
});
}

function msg(t){
document.getElementById("msg").innerHTML=t;
}

function clearUI(){
document.getElementById("msg").innerHTML="";
document.getElementById("resultBox").style.display="none";
}

function toggleMute(){
muted=!muted;
document.getElementById("music").muted=muted;
document.getElementById("spinSound").muted=muted;
document.getElementById("winSound").muted=muted;
}

function startMusic(){
let m=document.getElementById("music");
m.play().catch(()=>{});
}

function playSound(id){
document.getElementById(id).play().catch(()=>{});
}

function admin(){
let pass=prompt("Пароль:");
if(pass==="Daria2026"){
document.getElementById("admin").style.display="block";
}
}

function resetAll(){
if(confirm("Очистить всё?")){
localStorage.removeItem("players");
localStorage.removeItem("used");
location.reload();
}
}

function testSpin(){
angle+=360*5+Math.random()*360;
wheel.style.transform="rotate("+angle+"deg)";
}
</script>
</body>
</html>
